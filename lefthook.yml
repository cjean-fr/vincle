# Sequential: both jobs invoke `turbo` and build `@vincle/core`, whose build
# deletes its outputs before rewriting them. Running them in parallel races two
# `turbo` processes over the same directories, to save 50 ms.
pre-commit:
  parallel: false
  jobs:
    # oxfmt straight on the staged files: no lint-staged layer in between.
    - name: format
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      run: bun run lint
    - name: check
      run: bun run check
