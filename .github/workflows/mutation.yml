name: Mutation

# Manual trigger only. Run each package on its own runner so Stryker's worker
# pools do not compete for the same CPUs when selecting `all`.
#
# Thresholds live in each `stryker.config.json`. This workflow doesn't repeat
# them: Stryker exits non-zero under threshold on its own, and the job fails
# with it.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to mutate (workspace name), or "all" for all four'
        required: false
        default: all
        type: choice
        options:
          - all
          - "@vincle/core"
          - "@vincle/flow"
          - "@vincle/precompile"
          - "@vincle/eslint-plugin"

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'all' && '["@vincle/core", "@vincle/flow", "@vincle/precompile", "@vincle/eslint-plugin"]' || format('["{0}"]', inputs.package)) }}
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The input goes through the environment rather than script
      # interpolation: `choice` already constrains it, but interpolating an
      # input into a `run:` is the pattern we don't want copied elsewhere.
      - name: Mutation
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          bun x turbo run mutation --filter="$PACKAGE" --log-order=stream

      - name: Upload Mutation Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-reports-${{ strategy.job-index }}
          path: |
            packages/*/reports/
            packages/*/mutation/
          if-no-files-found: ignore
