name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # No turbo cache restored: `turbo run test` then builds only the *declared*
  # dependencies, so a test that expects any other one fails here. The main job
  # restores the cache and would not see it.
  #
  # Lint runs second: it builds `@vincle/eslint-plugin` and `core`, which would
  # mask their two cases (measured: 6 detections in this order, 4 in the other).
  cold-tree:
    name: Tests without prebuilt artefacts
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test — nothing built, nothing cached
        run: bun run test

      - name: Lint — builds the oxlint plugin it needs
        run: bun run lint

  # `bun test` proves nothing about Node, Deno or workerd, and `@vincle/core`
  # claims all four — down to `SyncContextStore`'s error message. This job runs
  # conformance against `dist`, so against the published artefact rather than
  # against the sources.
  conformance:
    name: Conformance — ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
    strategy:
      # Without this, the first failing runtime masks the other three — and
      # whether one gives out or all of them do is exactly what a conformance
      # matrix is there to say.
      fail-fast: false
      matrix:
        # Each entry declares what it needs rather than deriving it from its
        # name. `workerd` asks for Node because `npx wrangler` starts it, which
        # is not obvious, so it is written down.
        include:
          - runtime: bun
          - runtime: node
            needs_node: true
          - runtime: deno
            needs_deno: true
          - runtime: workerd
            needs_node: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Bun is required everywhere: it builds the `dist` all four load.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: matrix.needs_node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Deno
        if: matrix.needs_deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @vincle/core
        run: bun x turbo run build --filter=@vincle/core

      - name: Conformance — ${{ matrix.runtime }}
        run: bun run --filter=@vincle/core conformance:${{ matrix.runtime }}

      # Size is measured on `dist`, so here: this is the only job that builds it
      # for certain. Once (bun): the artefact is the same for all four runtimes.
      # Non-blocking — over budget, a `::warning::` annotation shows on the run.
      - name: Size report — @vincle/core
        if: matrix.runtime == 'bun'
        run: bun run --filter=@vincle/core size

  pipeline:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The pre-commit hook is not enough: `--no-verify` walks past it.
      - name: Lint
        run: bun run lint

      # Same reason as lint. Missing formatting breaks nothing at runtime; it
      # mixes substance and form in the next diff, which costs the repository's
      # only reviewer.
      - name: Format
        run: bunx oxfmt --check .

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      # Coverage stays here: the same suite with `--coverage`, a few seconds.
      # Mutation lives in `mutation.yml` — ten minutes on every PR did not pay.
      - name: Coverage
        run: bun run test:coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage/
            packages/*/badges/
          if-no-files-found: ignore

      # Measurement, no verdict: at this sample size the noise swallows the
      # deltas worth catching, and `apps/bench/README.md` records the three gate
      # shapes that were measured. The numbers stay readable on the run; the
      # cost is judged by reading them.
      - name: Benchmark
        shell: bash
        run: |
          mkdir -p apps/bench/results
          bun run --filter=@vincle/bench bench:stats -- --runs 8 | tee apps/bench/results/bench.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: apps/bench/results/
          if-no-files-found: ignore
