name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Pas de cache turbo restauré : `turbo run test` ne construit alors que les
  # dépendances *déclarées*, et un test qui en attend d'autres échoue ici. Le job
  # principal restaure le cache, donc il ne le verrait pas.
  #
  # Le lint passe en second : il construit `@vincle/eslint-plugin` et `core`, ce
  # qui masquerait leurs deux cas (mesuré : 6 détections dans cet ordre, 4 dans
  # l'autre).
  cold-tree:
    name: Tests without prebuilt artefacts
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test — nothing built, nothing cached
        run: bun run test

      - name: Lint — builds the oxlint plugin it needs
        run: bun run lint

  # `bun test` ne prouve rien sur Node, Deno ou workerd, et `@vincle/core` les
  # revendique tous les quatre — jusque dans le message d'erreur de
  # `SyncContextStore`. Ce job exécute la conformité contre `dist`, donc contre
  # l'artefact publié et non contre les sources.
  conformance:
    name: Conformance — ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
    strategy:
      # Sans ça, le premier runtime en échec masque les trois autres — or savoir
      # si un seul lâche ou si tous lâchent est justement l'information qu'une
      # matrice de conformité doit donner.
      fail-fast: false
      matrix:
        # Chaque entrée déclare ce dont elle a besoin plutôt que de le déduire de
        # son nom. `workerd` demande Node parce que `npx wrangler` le démarre :
        # ce n'est pas évident, donc c'est écrit.
        include:
          - runtime: bun
          - runtime: node
            needs_node: true
          - runtime: deno
            needs_deno: true
          - runtime: workerd
            needs_node: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Bun est requis partout : il construit le `dist` que les quatre chargent.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: matrix.needs_node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Deno
        if: matrix.needs_deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @vincle/core
        run: bun x turbo run build --filter=@vincle/core

      - name: Conformance — ${{ matrix.runtime }}
        run: bun run --filter=@vincle/core conformance:${{ matrix.runtime }}

      # La taille se mesure sur `dist`, donc ici : c'est le seul job qui le
      # construit à coup sûr. Une seule fois (bun) : l'artefact est le même pour
      # les quatre runtimes. Ne bloque pas — au-dessus du budget, une annotation
      # `::warning::` apparaît sur le run.
      - name: Size report — @vincle/core
        if: matrix.runtime == 'bun'
        run: bun test --cwd packages/core ./size-budget.test.ts

  pipeline:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Le hook pre-commit ne suffit pas : `--no-verify` passe à côté.
      - name: Lint
        run: bun run lint

      # Même raison que le lint, et elle s'est vérifiée : six fichiers de
      # production étaient non formatés alors que le hook existait — il ne
      # lançait pas oxfmt. Un formatage manquant ne casse rien à l'exécution,
      # il mélange fond et forme dans le prochain diff, ce qui coûte au seul
      # relecteur du dépôt.
      - name: Format
        run: bunx oxfmt --check .

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      # La couverture reste ici : c'est la même suite avec `--coverage`, quelques
      # secondes. La mutation, elle, est partie dans `mutation.yml` — dix minutes
      # sur chaque PR ne se justifiaient pas.
      - name: Coverage
        run: bun run test:coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage/
            packages/*/badges/
          if-no-files-found: ignore

      # Mesure, sans verdict. Trois formes de gate ont été essayées et aucune
      # ne tenait : ratios contre React (confondus avec le moteur et la
      # machine — 8 fausses régressions, aucune vraie), A/B contre un build
      # figé dans un processus isolé (σ 3 % par paire, la régression connue de
      # 3 % passait dessous), le même A/B dans le contexte complet (biais
      # d'ordre de 10 %, le build lent mesuré 13 % plus rapide). Les chiffres
      # restent lisibles sur le run ; c'est à la lecture que le coût se juge.
      - name: Benchmark
        shell: bash
        run: |
          mkdir -p apps/bench/results
          bun run --filter=@vincle/bench bench:stats -- --runs 8 | tee apps/bench/results/bench.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: apps/bench/results/
          if-no-files-found: ignore
