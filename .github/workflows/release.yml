name: Manual Release (Bun)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Select the package to publish"
        required: true
        type: choice
        options:
          - core
          - flow
          - eslint-plugin
          - vite-plugin
          - precompile

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` for checkout, `id-token: write` for npm provenance.
      # Nothing writes to the repository: no tag, no release.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate release commit
        run: |
          bun run lint
          bunx oxfmt --check .
          bun run check
          bun run test

      # Republishing an existing version needs no guard here: npm refuses the
      # duplicate and the job fails there.
      - name: Locate Package
        id: meta
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          case "$PACKAGE" in
            core|flow|eslint-plugin|vite-plugin|precompile) ;;
            *) echo "::error::Package is not available for release: $PACKAGE"; exit 1 ;;
          esac
          PACKAGE_DIR="packages/$PACKAGE"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "package_name=$(jq -r '.name' "$PACKAGE_DIR/package.json")" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: bun run build --filter="${{ steps.meta.outputs.package_name }}"

      - name: Setup Node (for OIDC support)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.20.0

      - name: Verify first-publication credentials
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view "$PACKAGE_NAME" name --json >/dev/null 2>&1 && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::If this is the first publication of $PACKAGE_NAME, add the NPM_TOKEN Actions secret before dispatching the release."
            exit 1
          fi

      - name: Verify core is published
        if: github.event.inputs.package != 'core'
        run: |
          CORE_VERSION="$(jq -r '.version' packages/core/package.json)"
          npm view "@vincle/core@${CORE_VERSION}" version

      # `bun pm pack`, not `npm pack`: only bun resolves the `workspace:` protocol
      # to a real version. Going through npm would publish `workspace:^` as is.
      #
      # `--quiet` prints only the tarball name, which is published by name: a
      # `*.tgz` would publish whichever came first if the directory held another.
      - name: Publish to NPM
        env:
          # Needed only to bootstrap packages that do not yet exist on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "${{ steps.meta.outputs.package_dir }}"
          TARBALL="$(bun pm pack --quiet | tail -n1)"
          # `--access public` explicitly, and not only via each package's
          # `publishConfig`: scoped packages default to `restricted`. Relying
          # on the manifest alone means one package missing the field fails its
          # *first* publish: the one release that cannot be retried into an
          # already-public name.
          npm publish "$TARBALL" --provenance --access public
