name: Manual Release (Bun)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Select the package to publish"
        required: true
        type: choice
        options:
          - core
          - flow
          - eslint-plugin
          - vite-plugin
          - precompile

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` for checkout, `id-token: write` for npm provenance.
      # Nothing writes to the repository: no tag, no release.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Republishing an existing version needs no guard here: npm refuses the
      # duplicate and the job fails there.
      - name: Locate Package
        id: meta
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          PACKAGE_DIR="packages/$PACKAGE"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "package_name=$(jq -r '.name' "$PACKAGE_DIR/package.json")" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: bun run build --filter="${{ steps.meta.outputs.package_name }}"

      - name: Setup Node (for OIDC support)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # `bun pm pack`, not `npm pack`: only bun resolves the `workspace:` protocol
      # to a real version. Going through npm would publish `workspace:^` as is.
      #
      # `--quiet` prints only the tarball name, which is published by name: a
      # `*.tgz` would publish whichever came first if the directory held another.
      - name: Publish to NPM
        run: |
          cd "${{ steps.meta.outputs.package_dir }}"
          TARBALL="$(bun pm pack --quiet | tail -n1)"
          # `--access public` explicitly, and not only via each package's
          # `publishConfig`: every package here is scoped, and npm defaults a
          # scoped package to `restricted`. Relying on the manifest alone means
          # one package missing the field fails its *first* publish: the one
          # release that cannot be retried into an already-public name.
          npm publish "$TARBALL" --provenance --access public
