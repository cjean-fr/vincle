name: Manual Release (Bun)
run-name: "Release ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Select the package to publish"
        required: true
        type: choice
        options:
          - core
          - flow
          - eslint-plugin
          - vite-plugin
          - precompile
          - ssg
          - create-vincle

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` to push the release tag, `id-token: write` for npm
      # provenance. The only repository write is the tag pushed after publish.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate release commit
        run: |
          bun run lint
          bunx oxfmt --check .
          bun run check
          bun run test

      # Republishing an existing version needs no guard here: npm refuses the
      # duplicate and the job fails there.
      - name: Locate Package
        id: meta
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          case "$PACKAGE" in
            core|flow|eslint-plugin|vite-plugin|precompile|ssg|create-vincle) ;;
            *) echo "::error::Package is not available for release: $PACKAGE"; exit 1 ;;
          esac
          PACKAGE_DIR="packages/$PACKAGE"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "package_name=$(jq -r '.name' "$PACKAGE_DIR/package.json")" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: bun run build --filter="${{ steps.meta.outputs.package_name }}"

      - name: Setup Node (for OIDC support)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.20.0

      - name: Verify first-publication credentials
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view "$PACKAGE_NAME" name --json >/dev/null 2>&1 && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::If this is the first publication of $PACKAGE_NAME, add the NPM_TOKEN Actions secret before dispatching the release."
            exit 1
          fi

      - name: Verify core is published
        if: github.event.inputs.package != 'core'
        run: |
          CORE_VERSION="$(jq -r '.version' packages/core/package.json)"
          npm view "@vincle/core@${CORE_VERSION}" version

      - name: Verify SSG integration is published
        if: github.event.inputs.package == 'ssg'
        run: |
          PLUGIN_VERSION="$(jq -r '.version' packages/vite-plugin/package.json)"
          npm view "@vincle/vite-plugin@${PLUGIN_VERSION}" version

      # `bun pm pack`, not `npm pack`: only bun resolves the `workspace:` protocol
      # to a real version. Going through npm would publish `workspace:^` as is.
      #
      # `--quiet` prints only the tarball name, which is published by name: a
      # `*.tgz` would publish whichever came first if the directory held another.
      - name: Publish to NPM
        env:
          # Needed only to bootstrap packages that do not yet exist on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "${{ steps.meta.outputs.package_dir }}"
          TARBALL="$(bun pm pack --quiet | tail -n1)"
          # `--access public` explicitly, and not only via each package's
          # `publishConfig`: scoped packages default to `restricted`. Relying
          # on the manifest alone means one package missing the field fails its
          # *first* publish: the one release that cannot be retried into an
          # already-public name.
          npm publish "$TARBALL" --provenance --access public

      # Tag the exact commit npm built from, so each published version maps to
      # a readable point in the repository. An existing tag is never moved:
      # the remote check fails the job instead of overwriting it.
      - name: Tag the published commit
        env:
          PACKAGE_DIR: ${{ steps.meta.outputs.package_dir }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: |
          VERSION="$(jq -r '.version' "$PACKAGE_DIR/package.json")"
          TAG="$PACKAGE_NAME@$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $PACKAGE_NAME $VERSION"
          git push origin "refs/tags/$TAG"
