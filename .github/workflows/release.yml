name: Manual Release (Bun)
run-name: "Release ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Select the package to publish"
        required: true
        type: choice
        options:
          - core
          - flow
          - eslint-plugin
          - vite-plugin
          - precompile
          - ssg
          - create-vincle

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` to push the release tag, `id-token: write` for npm
      # provenance. The only repository write is the tag pushed after publish.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate release commit
        run: |
          bun run lint
          bunx oxfmt --check .
          bun run check
          bun run test

      # A rerun after a failed tag step must not fail on the npm duplicate:
      # an already-published version skips the publish, and the tag step then
      # verifies from npm's provenance that this artefact was built from this
      # checkout before tagging it.
      - name: Locate Package
        id: meta
        env:
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          case "$PACKAGE" in
            core|flow|eslint-plugin|vite-plugin|precompile|ssg|create-vincle) ;;
            *) echo "::error::Package is not available for release: $PACKAGE"; exit 1 ;;
          esac
          PACKAGE_DIR="packages/$PACKAGE"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "package_name=$(jq -r '.name' "$PACKAGE_DIR/package.json")" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: bun run build --filter="${{ steps.meta.outputs.package_name }}"

      - name: Setup Node (for OIDC support)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.20.0

      - name: Verify first-publication credentials
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view "$PACKAGE_NAME" name --json >/dev/null 2>&1 && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::If this is the first publication of $PACKAGE_NAME, add the NPM_TOKEN Actions secret before dispatching the release."
            exit 1
          fi

      - name: Verify core is published
        if: github.event.inputs.package != 'core'
        run: |
          CORE_VERSION="$(jq -r '.version' packages/core/package.json)"
          npm view "@vincle/core@${CORE_VERSION}" version

      - name: Verify SSG integration is published
        if: github.event.inputs.package == 'ssg'
        run: |
          PLUGIN_VERSION="$(jq -r '.version' packages/vite-plugin/package.json)"
          npm view "@vincle/vite-plugin@${PLUGIN_VERSION}" version

      # `bun pm pack`, not `npm pack`: only bun resolves the `workspace:` protocol
      # to a real version. Going through npm would publish `workspace:^` as is.
      #
      # `--quiet` prints only the tarball name, which is published by name: a
      # `*.tgz` would publish whichever came first if the directory held another.
      - name: Publish to NPM
        env:
          # Needed only to bootstrap packages that do not yet exist on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "${{ steps.meta.outputs.package_dir }}"
          VERSION="$(jq -r '.version' package.json)"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Version $PACKAGE_NAME@$VERSION is already on npm: skipping the publish."
            exit 0
          fi
          TARBALL="$(bun pm pack --quiet | tail -n1)"
          # `--access public` explicitly, and not only via each package's
          # `publishConfig`: scoped packages default to `restricted`. Relying
          # on the manifest alone means one package missing the field fails its
          # *first* publish: the one release that cannot be retried into an
          # already-public name.
          npm publish "$TARBALL" --provenance --access public

      # Tag the commit npm actually built from, read back from the published
      # version's provenance rather than assumed to be HEAD, so each published
      # version maps to a readable point in the repository. An existing tag is
      # never moved: the remote check fails the job instead of overwriting it.
      - name: Tag the published commit
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          REPOSITORY: ${{ github.repository }}
          # The checkout keeps no credential (`persist-credentials: false`), so
          # the token is given to this step only, for the tag push below.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' "${{ steps.meta.outputs.package_dir }}/package.json")"
          TAG="$PACKAGE_NAME@$VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"
          ENCODED="${PACKAGE_NAME/\//%2f}"
          URL="https://registry.npmjs.org/-/npm/v1/attestations/$ENCODED@$VERSION"
          PUBLISHED_SHA=""
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED_SHA="$(curl -fsSL "$URL" | jq -r '
              .attestations[]
              | select(.predicateType == "https://slsa.dev/provenance/v1")
              | .bundle.dsseEnvelope.payload' | base64 -d | jq -r --arg repo "$REPOSITORY" '
              .predicate.buildDefinition.resolvedDependencies[]
              | select(.digest.gitCommit and (.uri | contains($repo)))
              | .digest.gitCommit' | head -n1)" && [ -n "$PUBLISHED_SHA" ] && break
            echo "Provenance for $TAG not visible yet (attempt $attempt); retrying."
            sleep 10
          done
          if [ -z "$PUBLISHED_SHA" ]; then
            echo "::error::No npm provenance found for $TAG; refusing to guess the published commit."
            exit 1
          fi
          if [ "$PUBLISHED_SHA" != "$HEAD_SHA" ]; then
            echo "::error::npm built $TAG from $PUBLISHED_SHA, not from this checkout ($HEAD_SHA). Refusing to tag."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $PACKAGE_NAME $VERSION"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "refs/tags/$TAG"
