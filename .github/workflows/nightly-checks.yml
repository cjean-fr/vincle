name: Nightly checks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Rotate the seed window while retaining each fuzzer's bounded default count.
  VINCLE_FUZZ_OFFSET: ${{ github.run_id }}

jobs:
  # ── Fuzz (core differential fuzzer) ──────────────────────────────────
  fuzz:
    name: Fuzz (differential)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        id: fuzz
        run: bun run --filter=@vincle/core mutation:fuzz

      - name: Upload fuzz reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-reports
          path: packages/core/reports/mutation-fuzz/
          if-no-files-found: ignore

  # ── Mutation (full suites) ───────────────────────────────────────────
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DO_NOT_TRACK: 1

    strategy:
      matrix:
        package: ["@vincle/flow", "@vincle/precompile"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Mutation — ${{ matrix.package }}
        run: bun x turbo run mutation --filter="${{ matrix.package }}" --log-order=stream

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: packages/*/reports/
          if-no-files-found: ignore

  # ── Issue management (runs after all test jobs) ───────────────────────
  _triage:
    name: Triage issues
    runs-on: ubuntu-latest
    needs: [fuzz, mutation]
    if: always()
    steps:
      - name: Ensure nightly label
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "nightly-fuzz",
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "nightly-fuzz",
                color: "d73a4a",
                description: "Nightly fuzz regression",
              });
            }

      - name: Fuzz — open / update issue on failure
        if: needs.fuzz.result == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const offset = process.env.VINCLE_FUZZ_OFFSET;
            const title = `Fuzz regression — seed offset ${offset}`;
            const body  = [
              `Nightly fuzz #${context.runNumber} failed with seed offset **${offset}** (${context.eventName}#${context.runId}).`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "### What it means",
              "The differential fuzz mutation run failed. Inspect the linked run and uploaded reports for the failing test or infrastructure error.",
              "",
              "### Reproduce locally",
              "```bash",
              `VINCLE_FUZZ_OFFSET=${offset} bun run --filter=@vincle/core mutation:fuzz`,
              "```",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              state:      "open",
              labels:     "nightly-fuzz",
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                title,
                body,
                labels:  ["nightly-fuzz"],
              });
            }
