name: Nightly checks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ── Fuzz (core differential fuzzer) ──────────────────────────────────
  fuzz:
    name: Fuzz (differential)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DO_NOT_TRACK: 1
      VINCLE_FUZZ_SEEDS: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fuzz tests
        id: fuzz
        continue-on-error: true
        run: bun run --filter=@vincle/core mutation:fuzz

      - name: Upload fuzz reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-reports
          path: packages/core/reports/mutation-fuzz/
          if-no-files-found: ignore

  # ── Mutation (full suites) ───────────────────────────────────────────
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DO_NOT_TRACK: 1

    strategy:
      matrix:
        package: [flow, precompile]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Mutation — ${{ matrix.package }}
        run: bun run --filter="@vincle/${{ matrix.package }}" mutation

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/
          if-no-files-found: ignore

  # ── Issue management (runs after all test jobs) ───────────────────────
  _triage:
    name: Triage issues
    runs-on: ubuntu-latest
    needs: [fuzz, mutation]
    if: always()
    steps:
      - name: Ensure nightly label
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "nightly-fuzz",
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "nightly-fuzz",
                color: "d73a4a",
                description: "Nightly fuzz regression",
              });
            }

      - name: Fuzz — open / update issue on failure
        if: needs.fuzz.result == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const seed  = process.env.VINCLE_FUZZ_SEEDS;
            const title = `Fuzz regression — seed ${seed}`;
            const body  = [
              `Nightly fuzz #${context.runNumber} failed on seed **${seed}** (${context.eventName}#${context.runId}).`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "### What it means",
              "Differential fuzzer suite (path / attr / precompile equivalence) did not reach a branch in one of the mutated source files. Either a mutant survived or the input generator hasn't grown enough coverage yet.",
              "",
              "### Reproduce locally",
              "```bash",
              `VINCLE_FUZZ_SEEDS=${seed}`,
              "bun run --filter=@vincle/core mutation:fuzz",
              "```",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              state:      "open",
              labels:     "nightly-fuzz",
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                title,
                body,
                labels:  ["nightly-fuzz"],
              });
            }
